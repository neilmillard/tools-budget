name: Deployment Workflow

# Trigger this workflow on pushes to the specified branch
on:
  push:
    branches:
      - main
  schedule:
    - cron: 12 10 * * SUN

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Install dependencies
        run: npm install

      - name: Test Next.js app
        run: npm test

      - name: Create Env file
        # create unexpected and undefined parameters - https://github.com/SpicyPizza/create-envfile/issues/10
        uses: SpicyPizza/create-envfile@v2.0.3
        with:
          envkey_NEXT_PUBLIC_ADSENSE_PUB_ID: ${{ secrets.NEXT_PUBLIC_ADSENSE_PUB_ID }}
          envkey_NEXT_PUBLIC_GTM_ID: ${{ secrets.NEXT_PUBLIC_GTM_ID }}
          envkey_NEXT_PUBLIC_FMP_API_KEY: ${{ secrets.NEXT_PUBLIC_FMP_API_KEY }}
          file-name: .env

      # Deployment is handled by Cloudflare Pages' own GitHub integration,
      # which builds and publishes `out/` on every push to main — no deploy
      # step is needed here. This job just keeps main green.

      # Cloudflare Pages only redeploys on a push to main, so the Sunday
      # cron run (which reveals posts whose frontmatter `date` has now
      # arrived) needs to explicitly trigger a rebuild — otherwise a post
      # can sit past its publish date without going live until the next
      # unrelated push. Requires a Pages deploy hook URL as a repo secret.
      - name: Trigger Cloudflare Pages rebuild (weekly publish)
        if: github.event_name == 'schedule'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "CLOUDFLARE_PAGES_DEPLOY_HOOK_URL not set, skipping rebuild trigger"
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"

      # Sends a newsletter campaign for each post that has crossed its
      # publish date since the last run, keyed off scripts/newsletter-state.json
      # rather than the content-generation batch, so the send cadence tracks
      # the site's actual staggered weekly releases.
      - name: Send newsletter for newly published posts
        if: github.event_name == 'schedule'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
        run: |
          if [ -z "$BREVO_API_KEY" ]; then
            echo "BREVO_API_KEY not set, skipping newsletter send"
            exit 0
          fi
          node scripts/send-newsletter.mjs

      - name: Commit newsletter state
        if: github.event_name == 'schedule'
        run: |
          if ! git diff --quiet scripts/newsletter-state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add scripts/newsletter-state.json
            git commit -m "chore: update newsletter state [skip ci]"
            git push
          fi
